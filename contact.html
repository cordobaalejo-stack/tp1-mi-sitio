<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form action="/registro" method="POST" novalidate>

  <div class="campo">
    <label for="nombre">Nombre completo</label>
    <input 
      type="text" 
      id="nombre" 
      name="nombre"
      placeholder="Ej: Juan Pérez" 
      required 
      minlength="3"
      aria-describedby="error-nombre ayuda-nombre">
    
    <small id="ayuda-nombre" class="ayuda">
      Mínimo 3 caracteres
    </small>
    <small id="error-nombre" class="error">
      Nombre inválido
    </small>
  </div>

  <div class="campo">
    <label for="email">Correo electrónico</label>
    <input 
      type="email" 
      id="email" 
      name="email"
      placeholder="juan@mail.com" 
      required
      aria-describedby="error-email">
    
    <small id="error-email" class="error">
      Ingresá un email válido
    </small>
  </div>

  <div class="campo">
    <label for="edad">Edad</label>
    <input 
      type="number" 
      id="edad" 
      name="edad"
      min="16" 
      max="99" 
      required
      aria-describedby="error-edad ayuda-edad">
    
    <small id="ayuda-edad" class="ayuda">
      Entre 16 y 99 años
    </small>
    <small id="error-edad" class="error">
      Edad fuera de rango
    </small>
  </div>

  <div class="campo">
    <label for="pass">Contraseña</label>
    <input 
      type="password" 
      id="pass" 
      name="password"
      minlength="8" 
      required
      aria-describedby="error-pass ayuda-pass">
    
    <small id="ayuda-pass" class="ayuda">
      Mínimo 8 caracteres
    </small>
    <small id="error-pass" class="error">
      Contraseña inválida
    </small>
  </div>

  <div class="campo">
    <label for="carrera">Carrera</label>
    <select 
      id="carrera" 
      name="carrera" 
      required
      aria-describedby="error-carrera">
      
      <option value="">-- Seleccioná --</option>
      <option value="sistemas">Análisis de Sistemas</option>
      <option value="redes">Redes</option>
    </select>

    <small id="error-carrera" class="error">
      Seleccioná una opción
    </small>
  </div>

  <button type="submit">Registrarse</button>

  <p class="exito" id="mensaje-exito" aria-live="polite">
    Registro enviado 
  </p>

</form>
